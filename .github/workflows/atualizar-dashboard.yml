name: Atualizar Indicador Ansell

on:
  schedule:
    # 09:00 UTC = 06:00 horario de Brasilia (BRT, UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Configurar identidade do git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rodar pipeline (extrair + atualizar + publicar)
        env:
          PORTAL_USER: ${{ secrets.PORTAL_USER }}
          PORTAL_PASS: ${{ secrets.PORTAL_PASS }}
        run: python pipeline_atualizar.py

      - name: Upload diagnostico (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-falha
          path: downloads_tmp/diagnostico/
          retention-days: 7
