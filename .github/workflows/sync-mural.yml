name: Sincronizar Mural para o Dashboard

# Disparado quando o Mural grava uma observacao nova direto em
# cliente_config.json (via API do GitHub, sem passar pelo PC do Mauro).
# Roda num runner do proprio GitHub (nuvem) -- so remenda o bloco RAW ja
# publicado em index.html, nao mexe no scraping do portal Brudam.
on:
  push:
    branches: [main]
    paths:
      - 'cliente_config.json'

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: sync-mural-dashboard
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aplicar observacoes do Mural no index.html
        run: python sync_mural_para_dashboard.py

      - name: Commit e push (se algo mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "Nada mudou em index.html."
            exit 0
          fi
          git add index.html
          git commit -m "Sincroniza observacoes do Mural no dashboard"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            echo "Push falhou (tentativa $i), tentando de novo em 5s..."
            sleep 5
          done
          echo "Nao foi possivel dar push apos varias tentativas." >&2
          exit 1
